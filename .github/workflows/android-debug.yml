# Builds debug APKs of the Android app on every push and on-demand via the
# Actions tab. Uploads them as workflow artifacts so you can download and
# sideload to a Fire tablet / Android phone for testing.
#
# Debug APKs are signed with the auto-generated Android debug key and are
# NOT acceptable for Amazon Appstore / Google Play uploads. For release
# submissions, follow Phase 4 of the README publishing guide.

name: Build debug APKs

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:        # adds a "Run workflow" button to the Actions tab

# Cancel any in-flight builds from the same branch when a new push comes in.
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build amazonDebug + googleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Space-separated; the action does NOT split on newlines.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Amazon debug APK
        working-directory: android
        run: gradle assembleAmazonDebug --no-daemon --stacktrace

      - name: Build Google debug APK
        working-directory: android
        run: gradle assembleGoogleDebug --no-daemon --stacktrace

      - name: Upload Amazon debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-amazon-debug
          path: android/app/build/outputs/apk/amazon/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Google debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-google-debug
          path: android/app/build/outputs/apk/google/debug/*.apk
          retention-days: 14
          if-no-files-found: error
