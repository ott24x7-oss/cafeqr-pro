# Builds debug APKs of the Android app on every push and on-demand via the
# Actions tab. Uploads them as workflow artifacts so you can download and
# sideload to a Fire tablet / Android phone for testing.
#
# Debug APKs are signed with the auto-generated Android debug key and are
# NOT acceptable for Amazon Appstore / Google Play uploads. For release
# submissions, follow Phase 4 of the README publishing guide.

name: Build debug APKs

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:        # adds a "Run workflow" button to the Actions tab

# Cancel any in-flight builds from the same branch when a new push comes in.
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build amazonDebug + googleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Allow the publish step (only on manual trigger) to commit the new
    # APKs back to public/downloads/. The default GITHUB_TOKEN only has
    # read scope; we need contents:write to push.
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Space-separated; the action does NOT split on newlines.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Amazon debug APK
        working-directory: android
        run: gradle assembleAmazonDebug --no-daemon --stacktrace

      - name: Build Google debug APK
        working-directory: android
        run: gradle assembleGoogleDebug --no-daemon --stacktrace

      - name: Upload Amazon debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-amazon-debug
          path: android/app/build/outputs/apk/amazon/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Google debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-google-debug
          path: android/app/build/outputs/apk/google/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # Manual-trigger only (Actions tab → Run workflow). Copies the
      # freshly-built APKs into public/downloads/ and commits — that
      # path is served as a static asset by Next.js, so the home-page
      # download buttons immediately point at the new build without
      # anyone having to fetch artifacts manually.
      #
      # Skipped on regular pushes to keep the repo from gaining 14 MB
      # of binary history every time someone touches android source.
      # The [skip ci] tag in the commit message prevents the new push
      # from re-triggering this workflow.
      - name: Publish APKs to public/downloads/
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/google/debug/app-google-debug.apk public/downloads/app-google-debug.apk
          cp android/app/build/outputs/apk/amazon/debug/app-amazon-debug.apk public/downloads/app-amazon-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/app-google-debug.apk public/downloads/app-amazon-debug.apk
          if git diff --cached --quiet; then
            echo "APKs are unchanged — nothing to commit."
          else
            git commit -m "ci: refresh APK downloads from build ${{ github.run_number }} [skip ci]"
            git push
            echo "Published new APKs to public/downloads/"
          fi
